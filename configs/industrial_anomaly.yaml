dataset_name: "raptor_industrial_anomaly_v1"
master_seed: 42
num_scenes: 250
views_per_scene: 4
resolution_wh: [640, 640]
render_backend: "cycles_optix"
samples_per_pixel: 32
max_vram_gb: 7.2
train_split_ratio: 0.85

camera_radius_range_m: [0.55, 1.35]
camera_elevation_deg_range: [20.0, 75.0]
camera_azimuth_deg_range: [0.0, 360.0]
focal_length_mm_range: [28.0, 50.0]
hdri_exposure_ev_range: [-1.5, 1.5]
hdri_rotation_deg_range: [0.0, 360.0]
pbr_metallic_range: [0.0, 0.95]
pbr_roughness_range: [0.05, 0.95]
distractor_count_range: [2, 8]

min_visibility_ratio: 0.15
max_truncation_ratio: 0.80
min_modal_area_px: 16
min_bbox_dim_px: 4.0

categories:
  - class_id: 0
    class_name: "structural_crack_panel"
    primitive_type: "box"
    dimensions_xyz_m: [0.18, 0.12, 0.04]
  - class_id: 1
    class_name: "corroded_valve_assembly"
    primitive_type: "cylinder"
    dimensions_xyz_m: [0.10, 0.10, 0.16]
  - class_id: 2
    class_name: "foreign_object_debris"
    primitive_type: "box"
    dimensions_xyz_m: [0.08, 0.06, 0.05]
  - class_id: 3
    class_name: "insulated_pipe_joint"
    primitive_type: "cylinder"
    dimensions_xyz_m: [0.14, 0.14, 0.22]
